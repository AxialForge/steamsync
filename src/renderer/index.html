<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Blocks all remote content (no non-localhost origins). 'unsafe-inline'/'unsafe-eval'
         and localhost connect-src are needed for Vite's dev-mode HMR + React refresh;
         they don't loosen the no-remote guarantee. Art loads via the ssart: scheme. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' ssart: data:; img-src 'self' ssart: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:* http://localhost:*" />
    <title>SteamSync</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
